name: Release

# When you publish a release on GitHub (Releases > Draft a new release, tag e.g. v0.1.0),
# this builds the addon zip, checks it, and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checks
        run: |
          pip install lupa
          python3 tools/test_addon.py
      - name: Build zip and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          toc=$(grep -m1 '^## Version:' BeestersDungeonMaps/BeestersDungeonMaps.toc | sed 's/## Version: *//' | tr -d '\r')
          case "$tag" in
            "v${toc}"|"v${toc}-"*) ;;
            *) echo "Release tag $tag does not match the addon version $toc in the TOC file."; exit 1 ;;
          esac
          ./tools/package.sh
          gh release upload "$tag" "dist/BeestersDungeonMaps-${toc}.zip" --clobber
