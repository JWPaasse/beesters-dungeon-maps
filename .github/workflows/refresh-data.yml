name: Refresh data

# Rebuilds all the addon's data, so nothing has to be updated by hand:
# - QuestieDB: entrances, quests, Forever bosses' loot
# - the WoW Forever client's boss table (wago.tools)
# - the CMaNGOS Classic database: quest text, classic bosses' loot with drop chances, item data
# - the WoW Forever client's own item tables (wago.tools), for the loot tooltips; else classic item stats
# and updates the data audit (docs/AUDIT.md).
# Daily while WoW Forever is new and data changes fast, weekly (Mondays) after DAILY_UNTIL.
# The workflow runs every day; after the cut-off date it skips every day except Monday.
# To change the cut-off, edit DAILY_UNTIL below. Manual runs ("Run workflow") always refresh,
# and so does any change to the data tools.
#
# A new release (and CurseForge upload) is only made when a file the addon loads in the game
# changed. Data files that no feature uses yet are kept up to date without a release.

on:
  schedule:
    - cron: "17 4 * * *"   # every day, 04:17 UTC (05:17 in the Netherlands in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  DAILY_UNTIL: "2026-12-23"   # two weeks after the December 9 raids open

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Daily or weekly?
        id: schedule
        run: |
          today=$(date -u +%F)
          weekday=$(date -u +%u)   # 1 = Monday
          if [ "${{ github.event_name }}" != "schedule" ] || [[ "$today" < "$DAILY_UNTIL" ]] || [ "$weekday" = "1" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Weekly mode: skipping until Monday."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.schedule.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Get QuestieDB
        if: steps.schedule.outputs.run == 'true'
        run: git clone --depth 1 https://github.com/Questie/QuestieDB.git /tmp/QuestieDB

      - name: Rebuild data
        if: steps.schedule.outputs.run == 'true'
        run: |
          pip install lupa
          python3 tools/build_data.py /tmp/QuestieDB
          python3 tools/build_quests.py /tmp/QuestieDB
          # The CMaNGOS Classic database: quest text, classic boss loot, item data and stats.
          # Each step keeps the old file if it fails.
          if python3 tools/get_classicdb.py /tmp/classicdb.sql.gz; then
            python3 tools/build_quest_text.py /tmp/classicdb.sql.gz --questiedb /tmp/QuestieDB || echo "::warning::Quest text not refreshed"
            python3 tools/build_classic_loot.py /tmp/classicdb.sql.gz || echo "::warning::Classic boss loot not refreshed"
          else
            echo "::warning::Classic database not downloaded; quest text and classic loot kept"
          fi
          # wago.tools can be briefly unavailable; keep yesterday's bosses rather than failing the run.
          python3 tools/build_bosses.py /tmp/QuestieDB || python3 tools/build_bosses.py /tmp/QuestieDB --loot-only || echo "::warning::Boss data not refreshed"
          if [ -f /tmp/classicdb.sql.gz ]; then
            python3 tools/build_loot_items.py /tmp/classicdb.sql.gz || echo "::warning::Loot item data not refreshed"
            python3 tools/build_classic_tooltips.py /tmp/classicdb.sql.gz || echo "::warning::Classic tooltips not refreshed"
          fi
          # Item tooltips: from the game's own item tables, else classic stats. Keeps the old data if wago.tools is down.
          python3 tools/fetch_game_items.py || echo "::warning::Game item data not refreshed"
          python3 tools/build_game_tooltips.py || echo "::warning::Game tooltips not rebuilt"
          python3 tools/fetch_loot_tooltips.py || echo "::warning::Loot tooltips not refreshed"
          python3 tools/audit.py

      - name: Run checks
        if: steps.schedule.outputs.run == 'true'
        run: python3 tools/test_addon.py

      - name: Commit, and publish if the addon's loaded data changed
        if: steps.schedule.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add BeestersDungeonMaps/Data tools/*.json docs/AUDIT.md
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          toc=BeestersDungeonMaps/BeestersDungeonMaps.toc
          loaded=$(grep -v '^##' "$toc" | tr -d '\r' | sed '/^\s*$/d; s#\\#/#g; s#^#BeestersDungeonMaps/#')
          # A changed comment (a new client build number in a header) is no reason for a release.
          changed=$(git diff --cached --name-only -I '^--')
          echo "Changed: $changed"
          git commit -m "Refresh data"
          git push

          if ! printf '%s\n' "$changed" | grep -qxF -f <(printf '%s\n' "$loaded"); then
            echo "Only data that no feature loads yet changed. No release."
            exit 0
          fi

          version=$(grep -m1 '^## Version:' "$toc" | sed 's/## Version: *//' | tr -d '\r')
          # A new version goes out through its own release (with its changelog) first.
          # Until that release exists, data updates are committed but not published.
          if ! gh release view "v${version}" >/dev/null 2>&1; then
            echo "Version ${version} has no release yet. The data goes out with that release."
            exit 0
          fi
          stamp=$(date -u +%Y%m%d%H%M)
          ./tools/package.sh
          tag="v${version}-data.${stamp}"
          gh release create "$tag" "dist/BeestersDungeonMaps-${version}.zip#BeestersDungeonMaps-${version}-data.${stamp}.zip" \
            --title "${version} data update ${stamp}" \
            --notes "Automatic data update. Same features as ${version}, with the latest dungeon entrances, quests and bosses." \
            --latest
          echo "zip=dist/BeestersDungeonMaps-${version}.zip" >> "$GITHUB_ENV"
          echo "label=${version}-data.${stamp}" >> "$GITHUB_ENV"

      - name: Upload the data update to CurseForge
        if: steps.schedule.outputs.run == 'true' && env.zip != ''
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: ./tools/upload_curseforge.sh "$zip" "$label" "Automatic data update."
