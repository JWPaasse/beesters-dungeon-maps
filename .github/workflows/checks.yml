name: Checks

# Runs the addon checks on every push, so a broken change shows up before a release.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checks
        run: |
          pip install lupa
          python3 tools/test_addon.py
