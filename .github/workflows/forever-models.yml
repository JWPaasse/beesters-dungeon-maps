name: Forever boss models

# Reads the models of the bosses new in WoW Forever (for their portraits)
# from the WoW Forever client's tables (wago.tools), and commits tools/forever_models.json.
# Runs when the script changes, or by hand. It never publishes a release.

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_forever_models.py"
      - ".github/workflows/forever-models.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the game's tables
        run: python3 tools/fetch_forever_models.py
      - name: Commit
        run: |
          git add tools/forever_models.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Forever boss models"
          git pull --rebase
          git push
